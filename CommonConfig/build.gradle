plugins {
    id 'java-library'
}

group = 'ducanh.pro'
version = '0.0.1-SNAPSHOT'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-web'
//    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    api "org.springframework.boot:spring-boot-starter-integration"
    api 'org.springframework.boot:spring-boot-starter-aop'
    api 'org.springframework.data:spring-data-commons'

    api group: 'org.modelmapper', name: 'modelmapper', version: '3.2.0'
    compileOnly 'org.hibernate.orm:hibernate-jpamodelgen:6.3.2.Final'
    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen:6.3.2.Final'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

compileJava {
    options.encoding = 'UTF-8'
}

javadoc {
    options.encoding = 'UTF-8'
}