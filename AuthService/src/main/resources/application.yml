server:
  port: 2001

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${spring.application.name}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: 'org.postgresql.Driver'
    hikari:
      maximumPoolSize: 120
      idleTimeout: 300000
      connectionTimeout: 300000
      leakDetectionThreshold: 300000
      schema: ${spring.application.name}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  application:
    name: auth